name: Bug Report
description: Report a bug in Eru
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible.
        
  - type: input
    id: version
    attributes:
      label: Eru Version
      placeholder: "1.0.0"
    validations:
      required: true
      
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - JVM
        - Scala Native
        - Both
    validations:
      required: true
      
  - type: input
    id: scala-version
    attributes:
      label: Scala Version
      placeholder: "3.7.2"
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code example or steps to reproduce the issue
      placeholder: |
        ```scala
        import net.ghoula.eru.prelude.*
        
        // Your code here
        ```
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages, stack traces, etc.)
    validations:
      required: true
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem (OS, JDK version, etc.)