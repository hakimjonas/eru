name: Feature Request
description: Suggest a new feature for Eru
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please help us understand your request.
        
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it enable?
    validations:
      required: true
      
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
    validations:
      required: true
      
  - type: textarea
    id: api-design
    attributes:
      label: API Design (Optional)
      description: What would the API look like?
      placeholder: |
        ```scala
        // Your proposed API
        ```
        
  - type: dropdown
    id: pillar-alignment
    attributes:
      label: Four Pillars Alignment
      description: Which of Eru's four pillars does this feature most align with?
      options:
        - "Foundational Correctness"
        - "Pragmatic Ergonomics" 
        - "Guided Correctness"
        - "Runtime Observability"
        - "Multiple Pillars"
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, examples, or references