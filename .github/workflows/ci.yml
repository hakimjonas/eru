name: Scala CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseZGC"
  SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseZGC"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run all checks (style, formatting, API compatibility)
        run: sbt check

      - name: Run JVM Core tests
        run: sbt eruCoreJVM/test

      - name: Run JVM Runtime tests
        run: sbt eruRuntimeJVM/test
        timeout-minutes: 10

      - name: Prepare Native compilation
        run: sbt eruCoreNative/compile eruRuntimeNative/compile

      - name: Compile Native test sources
        run: sbt eruCoreNative/Test/compile eruRuntimeNative/Test/compile

      - name: Run Native Core tests
        run: sbt eruCoreNative/test

      - name: Run Native Runtime tests
        run: sbt eruRuntimeNative/test

      - name: Run Integration tests
        run: sbt eruIntegrationTest/test

      - name: Check documentation (mdoc)
        run: sbt docs

      # TODO: Re-enable after first release (docsSite requires published artifacts)
