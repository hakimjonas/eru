name: Scala CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set JVM options for CI
        run: |
          export JAVA_OPTS="-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          export SBT_OPTS="-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run all checks (style, formatting, API compatibility)
        run: sbt check
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run JVM Core tests
        run: sbt eruCoreJVM/test
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run JVM Runtime tests (individual isolation)
        run: |
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.PromiseSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.DeferredSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.QueueSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.CountDownLatchSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.CyclicBarrierSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.HubSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.ParallelSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.QueueAsyncSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.CollectAllDeadlockSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.CoordinationConcurrencySpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.PromiseConcurrencySpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.HubConcurrencySpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.QueueConcurrencySpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.ConcurrencyStressSpec'
          timeout 90s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.TimersSpec'
          timeout 90s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.SuspendSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.VTForkSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.RetryPolicyPropertySpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.ParallelDegreeLimitedSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.ValidationPatternsSpec'
          timeout 30s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.RuntimeHealthCheck'
          timeout 90s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberStressSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberExecutionSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberErrorPropagationSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberInterruptionSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberLifecycleSpec'
          timeout 60s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberPropertySpec'
          timeout 90s sbt 'eruRuntimeJVM/testOnly net.ghoula.eru.fiber.FiberFinalizerIntegrationSpec'
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Prepare Native compilation
        run: sbt eruCoreNative/compile eruRuntimeNative/compile
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Compile Native test sources
        run: sbt eruCoreNative/Test/compile eruRuntimeNative/Test/compile
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run Native Core tests
        run: sbt eruCoreNative/test
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run Native Runtime tests
        run: sbt eruRuntimeNative/test
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run Integration tests
        run: sbt eruIntegrationTest/test
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Check documentation (mdoc)
        run: sbt docs
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Build documentation site
        run: sbt docsSite
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Run CI benchmarks (comprehensive sampling vs ZIO/Cats Effect)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running fast benchmarks for PR validation..."
            timeout 8m ./tools/run-benchmarks.sh ci --quick --output=ci-results
          else
            echo "Running thorough benchmarks for main branch..."
            timeout 12m ./tools/run-benchmarks.sh ci --thorough --output=ci-results
          fi
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-benchmark-results
          path: |
            ci-results/*.json
            ci-results/*.log
            ci-results/system-info-*.json
          retention-days: 30

  # Publish job: Runs only on tag pushes, publishes to Sonatype, creates GitHub release
  publish:
    if: startsWith(github.ref, 'refs/tags/') # Only run on tags like v1.0.0
    needs: build # Depends on the build job succeeding
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch full history for dynver/release notes

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PGP_SECRET }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}

      - name: Debug Secrets Availability
        run: |
          echo "Checking SONATYPE_USERNAME..."
          if [ -z "$SONATYPE_USERNAME" ]; then 
            echo "SONATYPE_USERNAME is empty or not set in the environment."
          else 
            echo "SONATYPE_USERNAME is SET in the environment."
          fi
          echo "Checking SONATYPE_PASSWORD..."
          if [ -z "$SONATYPE_PASSWORD" ]; then 
            echo "SONATYPE_PASSWORD is empty or not set in the environment."
          else 
            echo "SONATYPE_PASSWORD is SET in the environment."
          fi
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      # --- Publish to Sonatype and create GitHub Release ---
      - name: Publish release
        # It typically handles:
        # - PGP signing (using sbt-pgp settings, finds key via GPG agent)
        # - Publishing artifacts (JAR, sources, javadoc, POM, signatures)
        # - Staging the release on Sonatype
        # - Closing and releasing the staging repository on Sonatype
        # - Creating a GitHub Release for the tag
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }} # Passphrase for GPG key
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }} # Sonatype username/token
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }} # Sonatype password/token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token for creating GitHub release
        run: sbt +publishSigned sonatypeCentralUpload

      - name: Setup SSH for GitHub Pages
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - name: Configure Git for documentation publishing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish documentation to eru.ghoula.net
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"
        run: sbt docsPublish

  # SNAPSHOT publishing job: Publishes SNAPSHOT versions on pushes to main branch only
  publish-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build # Depends on the build job succeeding
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch full history for dynver

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PGP_SECRET }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}

      - name: Publish SNAPSHOT to Sonatype
        env:
          JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseG1GC"
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          echo "Publishing SNAPSHOT version..."
          sbt +publishSigned
          echo "SNAPSHOT published successfully!"